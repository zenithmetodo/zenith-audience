name: Validate Zenith Audience

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          if [ ! -f ".claude-plugin/plugin.json" ]; then
            echo "❌ Missing .claude-plugin/plugin.json"
            exit 1
          fi
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          echo "✅ plugin.json válido"

      # Los números NO se hardcodean aquí: se leen de la línea de counts del README
      # (README.md: "32 agentes · 22 commands · 102 knowledge files · …").
      # Así el repo y la documentación no pueden divergir sin que el CI se entere.
      - name: Counts · README vs repo (igualdad exacta)
        run: |
          line=$(grep -m1 -E '^\*\*[0-9]+ agentes · [0-9]+ commands · [0-9]+ knowledge files' README.md)
          if [ -z "$line" ]; then
            echo "❌ No encuentro la línea de counts en README.md"
            exit 1
          fi
          echo "📄 README: $line"
          want_agents=$(echo "$line" | sed -E 's/^\*\*([0-9]+) agentes.*/\1/')
          want_cmds=$(echo "$line" | sed -E 's/.*· ([0-9]+) commands.*/\1/')
          want_kn=$(echo "$line" | sed -E 's/.*· ([0-9]+) knowledge files.*/\1/')

          agents=$(ls agents/*.md | wc -l | xargs)
          cmds=$(ls commands/*.md | wc -l | xargs)
          kn=$(find knowledge/ -name "*.md" | wc -l | xargs)
          echo "📊 repo → agentes:$agents commands:$cmds knowledge:$kn"
          echo "📊 README → agentes:$want_agents commands:$want_cmds knowledge:$want_kn"

          fail=0
          if [ "$agents" -ne "$want_agents" ]; then echo "❌ agentes: $agents ≠ $want_agents (README)"; fail=1; fi
          if [ "$cmds"   -ne "$want_cmds"   ]; then echo "❌ commands: $cmds ≠ $want_cmds (README)"; fail=1; fi
          if [ "$kn"     -ne "$want_kn"     ]; then echo "❌ knowledge: $kn ≠ $want_kn (README)"; fail=1; fi
          if [ "$fail" -eq 1 ]; then exit 1; fi
          echo "✅ counts sincronizados"

      - name: Validate HTML templates
        run: |
          for f in templates/*.html; do
            if ! grep -q "Zenith Audience" "$f"; then
              echo "❌ $f no contiene branding Zenith"
              exit 1
            fi
          done
          echo "✅ HTML templates con branding correcto"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate Python scripts syntax
        run: |
          for f in scripts/*.py; do
            python3 -m py_compile "$f"
          done
          echo "✅ Scripts Python con sintaxis válida"

      - name: Verify all SVGs exist
        run: |
          required=("assets/zenith-audience-logo.svg" "assets/zenith-audience-banner.svg" "assets/arquitectura-modular.svg" "assets/pipeline-diario.svg")
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Falta: $f"
              exit 1
            fi
          done
          echo "✅ Todos los SVGs presentes"
